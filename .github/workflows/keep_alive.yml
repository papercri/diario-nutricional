name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta automáticamente todos los Martes y Viernes a las 12:00 PM UTC
    - cron: '0 12 * * 2,5'
  workflow_dispatch: # Esto te permite activar la acción a mano cuando quieras probarla

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer petición HTTP a la API de Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
